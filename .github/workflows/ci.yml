name: CI

on:
  push:
    branches: [main, Work-in-progress]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and tooling
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Mypy strict type check
        run: mypy ledger

      - name: Unit and canary tests
        run: pytest -v --cov=ledger --cov-report=term-missing

      - name: Hypothesis property-based invariant tests
        run: pytest tests/property/ -v --hypothesis-seed=42
