[build-system]
requires = ["hatchling", "editables>=0.3"]
build-backend = "hatchling.build"

[project]
name = "ledger"
version = "0.1.0"
description = "Bitemporal Point-in-Time Feature Store & Leakage Canary Engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ledger Quant Engineering" }
]

dependencies = [
    "polars>=0.20.0",
    "duckdb>=0.9.0",
    "pyarrow>=14.0.0",
    "pydantic>=2.0.0",
    "exchange-calendars>=4.5.0",
    "yfinance>=0.2.30",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "pytz>=2023.3",
]

[project.scripts]
ledger = "ledger.cli:main"

[project.optional-dependencies]
backtest = [
    "vectorbt>=0.26.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.6",
    "mypy>=1.7.0",
    "pandas-stubs>=2.0.0",
    "types-pytz>=2023.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["ledger"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["guides"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = []

[tool.mypy]
python_version = "3.10"
strict = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "exchange_calendars.*",
    "yfinance.*",
    "vectorbt.*",
    "scipy.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short -m 'not integration'"
markers = [
    "integration: mark test as requiring external network or live feeds",
    "benchmark: mark test as a performance benchmark",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:Sortedness of columns cannot be checked when 'by' groups provided:UserWarning",
]
